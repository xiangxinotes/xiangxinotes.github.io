<div class="post__share">
  <span class="share__title">分享这篇文章：</span>
  <ul class="share__list list-reset">
    <li class="share__item">
      <a class="share__facebook" href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ site.baseurl }}{{ page.url }}?utm_source=facebook%26utm_medium=social-share%26utm_campaign={{ page.slug }}"
        onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;"
        title="Share on Facebook" rel="nofollow noopener noreferrer">
        <ion-icon name="logo-facebook"></ion-icon>
      </a>
    </li>
    <li class="share__item">
      <a class="share__x" href="https://x.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ site.baseurl }}{{ page.url }}?utm_source=x.com%26utm_medium=social-share%26utm_campaign={{ page.slug }}"
        onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;"
        title="Share on X" rel="nofollow noopener noreferrer">
        <ion-icon name="logo-x"></ion-icon>
      </a>
    </li>
    <li class="share__item">
      <a class="share__linkedin" href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ site.baseurl }}{{ page.url }}?utm_source=linkedin%26utm_medium=social-share%26utm_campaign={{ page.slug }}"
        onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" title="Share on LinkedIn" rel="nofollow noopener noreferrer">
        <ion-icon name="logo-linkedin"></ion-icon>
      </a>
    </li>
    <li class="share__item">
      <a class="share__pinterest" href="http://pinterest.com/pin/create/button/?url={{ site.url }}{{ site.baseurl }}{{ page.url }}?utm_source=pinterest%26utm_medium=social-share%26utm_campaign={{ page.slug }}&amp;media={{ site.url }}{{ site.baseurl }}/images/{{ page.image }}&amp;description={{ page.title | uri_escape }}"
        onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=900,height=500,toolbar=1,resizable=0'); return false;" title="Share on Pinterest"
        rel="nofollow noopener noreferrer">
        <ion-icon name="logo-pinterest"></ion-icon>
      </a>
    </li>
    <li class="share__item">
      <a class="share__weibo" href="https://service.weibo.com/share/share.php?url={{ site.url }}{{ site.baseurl }}{{ page.url }}?utm_source=weibo%26utm_medium=social-share%26utm_campaign={{ page.slug }}&title={{ page.title | uri_escape }}&pic={{ site.url }}{{ site.baseurl }}/images/{{page.image}}"
        onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=900,height=500,toolbar=1,resizable=0'); return false;" title="分享到微博"
        rel="nofollow noopener noreferrer"><i class="fa-brands fa-weibo"></i></a>
    </li>
    <li class="share__item">
      <a class="share__qzone" href="https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?url={{ site.url }}{{ site.baseurl }}{{ page.url }}?utm_source=qzone%26utm_medium=social-share%26utm_campaign={{ page.slug }}&title={{ page.title | uri_escape }}&summary={{ page.description | uri_escape }}&pics={{ site.url }}{{ site.baseurl }}/images/{{page.image}}"
        onclick="window.open(this.href, 'pop-up', 'left=20,top=20,width=900,height=500,toolbar=1,resizable=0'); return false;" title="分享到QQ空间"
        rel="nofollow noopener noreferrer"><i class="fa-brands fa-qq"></i></a>
    </li>
    <!-- <li class="share__item">
      <a class="share__copylink" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}"
        onclick="navigator.clipboard.writeText(this.href).then(function() { confirm('链接已复制到剪贴板'); });
         return false;" title="复制链接到剪贴板"
        rel="nofollow noopener noreferrer"><ion-icon name="copy"></ion-icon></a>
    </li> -->
  </ul>
</div>
