<div class="recommend-section dark-subscribe-section">
  <h4 class="recommend-title-heading">📰 不想错过文章更新？</h4>
  
  <p class="subscribe__desc">每周日一篇原创文章发到你邮箱，随时退订。</p>
  
  <form class="subscribe-form" action="{% if site.data.settings.mailchimp %}//{{site.data.settings.mailchimp}}{% else %}#{% endif %}" method="POST" target="_blank" novalidate>
    <input class="subscribe__email" type="email" name="EMAIL" placeholder="你的邮箱地址" required>
    <button class="subscribe__button" type="submit">立即订阅</button>
  </form>
</div>
